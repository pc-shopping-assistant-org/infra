name: pc-shopping-assistant-prod

services:
  ai-service:
    image: ${AI_SERVICE_IMAGE:?AI_SERVICE_IMAGE must be set to the GHCR image}
    restart: unless-stopped
    init: true
    env_file:
      - path: ../env/prod.env
        required: false
    environment:
      APP_ENV: production
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      # The FastAPI client reads the canonical AI_* settings. Keep the API
      # root explicit so the image cannot silently fall back to localhost.
      AI_BACKEND_API_URL: ${AI_BACKEND_API_URL:?AI_BACKEND_API_URL must be set}
      AI_RETRIEVAL_BACKEND: ${AI_RETRIEVAL_BACKEND:-backend}
      AI_QDRANT_URL: ${AI_QDRANT_URL:-http://qdrant:6333}
      AI_QDRANT_COLLECTION: ${AI_QDRANT_COLLECTION:-products}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-http}
      AI_EMBEDDING_API_URL: ${AI_EMBEDDING_API_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-384}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${AI_SERVICE_BIND_ADDRESS:-127.0.0.1}:${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pc_shopping}
      POSTGRES_USER: ${POSTGRES_USER:-pc_shopping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          http://127.0.0.1:6333/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-pc-shopping-assistant-prod-postgres}
  qdrant_data:
    name: ${QDRANT_VOLUME_NAME:-pc-shopping-assistant-prod-qdrant}

networks:
  app:
    name: ${APP_NETWORK_NAME:-pc-shopping-assistant-prod-app}
  data:
    name: ${DATA_NETWORK_NAME:-pc-shopping-assistant-prod-data}
