name: Verify and deploy stack

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release/production' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate profiles and release behavior without starting containers
        run: |
          python3 -m unittest discover -s tests -v
          bash -n compose.sh scripts/deploy.sh scripts/seed-prod.sh scripts/deploy-release.sh config/postgres/init-databases.sh
          python3 scripts/release_images.py

  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/release/production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      INFRA_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate desired image versions
        run: python3 scripts/release_images.py >> "$GITHUB_ENV"
      - name: Upload config and deploy dependencies and application images
        shell: bash
        run: |
          set -euo pipefail
          version_pattern='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?'
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skip superseded infra release; branch head has changed'
            exit 0
          fi
          : "${SSH_HOST:?Set release variable SSH_HOST}"
          : "${SSH_USER:?Set release variable SSH_USER}"
          : "${DEPLOY_PATH:?Set release variable DEPLOY_PATH}"
          : "${SSH_PRIVATE_KEY:?Set release secret SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set release secret SSH_KNOWN_HOSTS}"
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          for tag in "$BACKEND_IMAGE_TAG" "$AI_IMAGE_TAG" "$WEB_IMAGE_TAG"; do
            [[ "$tag" =~ ^${version_pattern}$ || "$tag" =~ ^sha-[0-9a-f]{40}$ ]]
          done
          key_file="$RUNNER_TEMP/gearpc-deploy-key"
          hosts_file="$RUNNER_TEMP/gearpc-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh_options=(-i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o "UserKnownHostsFile=$hosts_file")
          destination="$SSH_USER@$SSH_HOST"
          stage="$DEPLOY_PATH/.incoming/$INFRA_REVISION"
          # Paths/tags are validated locally before passing them to the remote shell.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$destination" "mkdir -p -- '$stage'"
          rsync -az --exclude='.git/' --exclude='.env*' --exclude='.release.env*' \
            --exclude='.deploy.lock' --exclude='.incoming/' --exclude='backups/' \
            --exclude='__pycache__/' \
            -e "ssh -i $key_file -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts_file" \
            ./ "$destination:$stage/"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$destination" "bash -s -- '$DEPLOY_PATH' '$stage' '$BACKEND_IMAGE_TAG' '$AI_IMAGE_TAG' '$WEB_IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail
          root=$1
          stage=$2
          exec 9>"$root/.deploy.lock"
          flock -w 600 9
          test -f "$root/.env.docker"
          docker compose --env-file "$root/.env.docker" -f "$stage/compose.yaml" --profile apps config --quiet
          cp -a "$stage/." "$root/"
          cd -- "$root"
          DEPLOY_LOCK_HELD=1 source scripts/deploy-release.sh "$3" "$4" "$5"
          REMOTE
